spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/supersonic?stringtype=unspecified
    username: postgres
    password: postgres
  sql:
    init:
      continue-on-error: true
      mode: always
      username: postgres
      password: postgres
      schema-locations: classpath:db/schema-postgres.sql,classpath:db/schema-postgres-demo.sql
      data-locations: classpath:db/data-postgres.sql,classpath:db/data-postgres-demo.sql

s2:
  embedding:
    store:
      provider: PGVECTOR
      base:
        url: localhost
      port: 5432
      databaseName: supersonic
      user: postgres
      password: postgres
      dimension: 512